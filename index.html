<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharmacy</title>
  </head>
  <body>
    <div class="container">
      <div class="window-header">
        <h1 class="window-title">Pharmacy Service</h1>
        <div class="window-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="p-4">
        <h5 class="section-title mb-4">Products</h5>

        <form id="productForm">
          <input type="hidden" id="productId" />

          <div class="mb-3">
            <label for="productName" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="productName"
              placeholder="Product name"
              required
            />
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="productPrice" class="form-label">Price</label>
              <input
                type="number"
                class="form-control"
                id="productPrice"
                placeholder="Price"
                required
              />
            </div>
            <div class="col-md-4">
              <label for="productQty" class="form-label">Quantity</label>
              <input
                type="number"
                class="form-control"
                id="productQty"
                placeholder="Quantity"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 mb-5">
            <button
              type="submit"
              id="btnSubmit"
              class="btn btn-save text-uppercase"
            >
              Save
            </button>
            <button
              type="reset"
              id="btnCancel"
              class="btn btn-cancel text-uppercase"
            >
              Cancel
            </button>
          </div>
        </form>

        <div id="productList" class="product-list">
            </div>
    </div>
</div>
<script src="renderer.js"></script>
    
</body>
</html>
