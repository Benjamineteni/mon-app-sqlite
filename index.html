<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharmacy</title>
  </head>
  <body>
    <div class="container">
      <div class="window-header">
        <h1 class="window-title">Pharmacy Service</h1>
        <div class="window-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="p-4">
        <h5 class="section-title mb-4">Products</h5>

        <form id="productForm">
          <div class="mb-3">
            <label for="productName" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="productName"
              placeholder="Product name"
              required
            />
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="productPrice" class="form-label">Price</label>
              <input
                type="number"
                class="form-control"
                id="productPrice"
                placeholder="Price"
                required
              />
            </div>
            <div class="col-md-4">
              <label for="productQty" class="form-label">Quantity</label>
              <input
                type="number"
                class="form-control"
                id="productQty"
                placeholder="Quantity"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 mb-5">
            <button
              type="submit"
              id="btnSubmit"
              class="btn btn-save text-uppercase"
            >
              Save
            </button>
            <button
              type="reset"
              id="btnCancel"
              class="btn btn-cancel text-uppercase"
            >
              Cancel
            </button>
          </div>
        </form>

        <div class="product-list">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th class="text-start">Price</th>
                <th class="text-center">Quantity</th>
                <th class="text-start">Actions</th>
              </tr>
            </thead>
            <tbody id="product-list"></tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this product?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="btnConfirmDelete">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/renderer.js"></script>
  </body>
</html>
