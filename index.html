<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
        }

        .input-box input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .register {
            text-align: center;
            margin-top: 15px;
        }
    </style>
    <title>Page de connexion</title>

    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <div class="container">

        <div class="login-box">
            <h2>Connexion</h2>

            <form>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Entrez votre email" required>
                </div>

                <div class="input-box">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="Entrez votre mot de passe" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Se souvenir
                    </label>

                    <a href="#">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn">
                    Se connecter
                </button>

                <div class="register">
                    Pas encore de compte ?
                    <a href="#">Créer un compte</a>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
